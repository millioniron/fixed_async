defaults:
  - tu_pipeline_env
  - _self_

checkpoint_config:
  type: file_system
  output_dir: /agentic_tu_pipeline/models/${exp_name}

resume_from_checkpoint: /agentic_tu_pipeline/models/old-logits-qwen3-4B-tu-pipeline-min_turn_gt_3-ewma_075_1006_segment_1006_autoreset_09_10/20260427-030539/checkpoint-90

old_log_probs_source: ewma_prox
ewma_prox_beta: 0.75
ewma_prox_reset_on_low_remaining_ratio: true
ewma_prox_reset_remaining_ratio_threshold: 0.9

pg_clip_low: 0.005
pg_clip_high: 0.006

train_infer_correction:
  is_weight:
    enabled: true
    weight_type: token
    upper_bound: 2.0
    detach: true
  filters:
    - enabled: true
      agg_type: segment
      ratio_enabled: true
      ratio_low: 0.99
      ratio_high: 1.01
      diff_enabled: false
      diff_low: -0.1
      diff_high: 0.1

actor_train:
  worker_cls: roll.pipeline.agentic.agentic_actor_pg_worker.ActorWorker
  pg_variant: ppo
  model_args:
    disable_gradient_checkpointing: false
    dtype: bf16
    model_type: ~
  training_args:
    learning_rate: 1.0e-6
    weight_decay: 0
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 128
    warmup_steps: 20
    num_train_epochs: 200
    lr_scheduler_type: cosine
  data_args:
    template: qwen3
  strategy_args:
    strategy_name: megatron_train
    strategy_config:
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 1
      use_distributed_optimizer: false
      recompute_granularity: full
  device_mapping: list(range(0,2))
  infer_batch_size: 1
  use_dynamic_batching_in_train: true
  max_tokens_per_microbatch_in_train: 32768
  sequence_length_round_in_train: 128
  use_dynamic_batching_in_infer: true
  max_tokens_per_microbatch_in_infer: 65536
  sequence_length_round_in_infer: 128
