defaults:
  - tu_pipeline_env
  - _self_

sequence_length: 19968      # Accommodate longer multi-turn trajectories

checkpoint_config:
  type: file_system
  output_dir: /agentic_tu_pipeline/models/${exp_name}
  save_optimizer_state: false
  load_optimizer_state: false

pretrain: /models/Qwen3-30B-A3B-Thinking-2507
reward_pretrain: /models/Qwen3-30B-A3B-Thinking-2507

old_log_probs_source: ewma_prox
ewma_prox_beta: 0.75
ewma_prox_reset_on_low_remaining_ratio: true
ewma_prox_reset_remaining_ratio_threshold: 0.9


use_pg_clip_range: true
pg_clip_low: 0.005
pg_clip_high: 0.006
ratio_type: segment
val_batch_size: 64
rollout_batch_size: 256

train_infer_correction:
  is_weight:
    enabled: true
    weight_type: token
    upper_bound: 2.0
    detach: true
  filters:
    - enabled: true
      agg_type: segment
      ratio_enabled: true
      ratio_low: 0.994
      ratio_high: 1.006
      diff_enabled: false
      diff_low: -0.1
      diff_high: 0.1

actor_train:
  worker_cls: roll.pipeline.agentic.agentic_actor_pg_worker.ActorWorker
  pg_variant: ppo
  model_args:
    disable_gradient_checkpointing: false
    dtype: bf16
    model_type: ~
  training_args:
    learning_rate: 1.0e-6
    weight_decay: 0
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 256
    warmup_steps: 20
    num_train_epochs: 200
    lr_scheduler_type: cosine
  data_args:
    template: qwen3
  strategy_args:
    strategy_name: megatron_train
    strategy_config:
      tensor_model_parallel_size: 4
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 1
      use_distributed_optimizer: true
      sequence_parallel: true
      recompute_granularity: null
      moe_token_dispatcher_type: "alltoall"
      moe_grouped_gemm: true
      moe_layer_recompute: true
      optimizer_cpu_offload: true
      optimizer_offload_fraction: 1.0
  device_mapping: list(range(0,4))
  infer_batch_size: 1
  use_dynamic_batching_in_train: true
  max_tokens_per_microbatch_in_train: 19968
  sequence_length_round_in_train: 128
  use_dynamic_batching_in_infer: true
  max_tokens_per_microbatch_in_infer: 49152
  sequence_length_round_in_infer: 128



actor_infer:
  model_args:
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: 8192
    top_p: 0.99
    top_k: 100
    num_beams: 1
    temperature: 0.99
    num_return_sequences: 1
    logprobs: 1
    enable_thinking: true
  data_args:
    template: qwen3
  strategy_args:
    strategy_name: sglang
    strategy_config:
      mem_fraction_static: 0.85
      load_format: auto
    # strategy_name: vllm
    # strategy_config:
    #   gpu_memory_utilization: 0.85
    #   max_model_len: 32768
    #   load_format: auto
  device_mapping: list(range(4,8))
  infer_batch_size: 1

train_env_manager:
  max_env_num_per_worker: 16
  num_env_groups: 32
  group_size: 8
  tags: [TUPipeline]
  num_groups_partition: [32]

val_env_manager:
  max_env_num_per_worker: 32
  num_env_groups: 8
  group_size: 8
  tags: [TUPipeline]
  num_groups_partition: [8]
