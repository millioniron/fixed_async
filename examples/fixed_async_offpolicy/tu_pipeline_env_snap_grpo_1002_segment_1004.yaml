defaults:
  - tu_pipeline_env
  - _self_

checkpoint_config:
  type: file_system
  output_dir: /agentic_tu_pipeline/models/${exp_name}

old_log_probs_source: snapshot_old

pg_clip_low: 0.003
pg_clip_high: 0.004

train_infer_correction:
  is_weight:
    enabled: true
    weight_type: token
    upper_bound: 2.0
    detach: true
  filters:
    - enabled: true
      agg_type: segment
      ratio_enabled: true
      ratio_low: 0.998
      ratio_high: 1.002
      diff_enabled: false
      diff_low: -0.1
      diff_high: 0.1
