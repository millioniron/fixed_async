hydra:
  run:
    dir: .
  output_subdir: null

exp_name: "old-logits-qwen3-4B-tu-pipeline${oc.env:TU_PIPELINE_EXP_SUFFIX,}${oc.env:TU_PIPELINE_RUN_TAG_SUFFIX,}"
seed: 42
logging_dir: ./output/logs
output_dir: ./output
system_envs:
  USE_MODELSCOPE: '1'

checkpoint_config:
  type: file_system
  output_dir: /agentic_tu_pipeline/models/${exp_name}
track_with: wandb
tracker_kwargs:
  project: ${oc.env:WANDB_PROJECT,roll-tu-pipeline}
  name: ${exp_name}
  mode: offline
  log_dir: ./wandb/roll_exp/${exp_name}
rollout_dump_dir: ./rollout/roll_exp/${exp_name}

num_gpus_per_node: 8
max_steps: 800
save_steps: 30
logging_steps: 1
eval_steps: 40

# resume_from_checkpoint: false

# resume_from_checkpoint: /ROLL/agentic_tu_pipeline/models/old-logits-qwen3-4B-tu-pipeline-min_turn_gt_3-snapshot_old_grpo_1005_segment_1006/20260405-154947/checkpoint-280

prompt_length: 4096         # Larger than travel (more complex env descriptions + tool schemas)
# sequence_length: 24000      # Accommodate longer multi-turn trajectories
sequence_length: 32768      # Accommodate longer multi-turn trajectories
rollout_batch_size: 256
val_batch_size: 64

ppo_epochs: 1
# adv_estimator: "reinforce"
adv_estimator: "grpo"

num_return_sequences_in_group: 1
loss_agg_mode: "seq-mean-token-mean"

use_pg_clip_range: true
pg_clip_low: 0.005
pg_clip_high: 0.006
ratio_type: segment

# norm_mean_type: group
# norm_std_type: batch

# max_len_mask: true
# error_max_len_clip: false

difficulty_loss_weight: false
length_loss_weight: false

add_token_level_kl: false
use_kl_loss: false
init_kl_coef: 0.0
entropy_loss_coef: 0
max_grad_norm: 1.0

global_template: qwen3
pretrain: /models/Qwen3-4B-Thinking-2507
reward_pretrain: /models/Qwen3-4B-Thinking-2507

async_generation_ratio: 3
# ewma_prox_beta: 0.999

# ============ old_log_probs_source 五种配置示例 ============
# `old_log_probs_source` 是主控配置。
# `proximal_logprob_approx` 会由代码根据 source 自动归一化，通常无需手工再配。
#
# 1. current_recompute
# old_log_probs_source: current_recompute
#
# 2. snapshot_old
# enable_async_old_logprobs_snapshot: true
# old_log_probs_source: snapshot_old
# #
# 3. interp_prox_loglinear
# old_log_probs_source: interp_prox_loglinear
#
# 4. interp_prox_linear
# old_log_probs_source: interp_prox_linear
#
# 5. ewma_prox
old_log_probs_source: ewma_prox
ewma_prox_beta: 0.9

train_infer_correction:
  is_weight:
    enabled: true
    weight_type: token
    upper_bound: 2.0
    detach: true
  filters:
    - enabled: true
      agg_type: segment
      ratio_enabled: true
      ratio_low: 0.99
      ratio_high: 1.01
      diff_enabled: false
      diff_low: -0.1
      diff_high: 0.1

