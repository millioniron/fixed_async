# ============ Actor Train ============

  # worker_cls: roll.pipeline.agentic.agentic_actor_pg_worker.ActorWorker
  # pg_variant: topr

# ratio_type: segment
actor_train:
  worker_cls: roll.pipeline.agentic.agentic_actor_pg_worker.ActorWorker
  pg_variant: ppo
  model_args:
    disable_gradient_checkpointing: false
    dtype: bf16
    model_type: ~
  training_args:
    learning_rate: 1.0e-6
    weight_decay: 0
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 128
    warmup_steps: 20
    num_train_epochs: 200
    lr_scheduler_type: cosine
  data_args:
    template: qwen3
  strategy_args:
    strategy_name: megatron_train
    strategy_config:
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 1
      use_distributed_optimizer: false
      recompute_granularity: full
  device_mapping: list(range(0,2))
  infer_batch_size: 1
  use_dynamic_batching_in_train: true
  max_tokens_per_microbatch_in_train: 65536
  sequence_length_round_in_train: 128
  use_dynamic_batching_in_infer: true
  max_tokens_per_microbatch_in_infer: 65536
  sequence_length_round_in_infer: 128
  # use_dynamic_batching_in_infer: true
  # max_tokens_per_microbatch_in_infer: 43008
  # sequence_length_round_in_infer: 128
# ============ Actor Infer ============
actor_infer:
  model_args:
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: 8192
    top_p: 0.99
    top_k: 100
    num_beams: 1
    temperature: 0.99
    num_return_sequences: 1
    logprobs: 1
  data_args:
    template: qwen3
  strategy_args:
    strategy_name: sglang
    strategy_config:
      mem_fraction_static: 0.85
      load_format: auto
    # strategy_name: vllm
    # strategy_config:
    #   gpu_memory_utilization: 0.85
    #   max_model_len: 32768
    #   load_format: auto
  device_mapping: list(range(2,8))
  infer_batch_size: 1

# ============ Reference ============
reference:
  model_args:
    disable_gradient_checkpointing: true
    dtype: bf16
    model_type: ~
  data_args:
    template: qwen3
  strategy_args:
    strategy_name: megatron_infer
    strategy_config:
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 1
  device_mapping: list(range(0,2))
  infer_batch_size: 2

# ============ Reward Normalization ============
reward_normalization:
  grouping: traj_group_id
  method: mean_std

# ============ Environment Manager ============
max_tokens_per_step: 8192
max_actions_per_traj: 15             # TU-Pipeline avg 6.22 steps, max headroom 15
default_history_length: ${max_actions_per_traj}
env_manager_cls: roll.pipeline.agentic.env_manager.traj_env_manager.TrajEnvManager

train_env_manager:
  max_env_num_per_worker: 16
  num_env_groups: 32
  group_size: 8
  tags: [TUPipeline]
  num_groups_partition: [32]

val_env_manager:
  max_env_num_per_worker: 32
  num_env_groups: 8
  group_size: 8
  tags: [TUPipeline]
  num_groups_partition: [8]

# ============ Custom Environments ============
custom_envs:
  TUPipeline:
    env_type: gz_tu_pipeline
    max_steps: ${max_actions_per_traj}
    max_tokens_per_step: ${max_tokens_per_step}
    env_manager_cls: ${env_manager_cls}
    use_thread_lock: true
    history_length: ${default_history_length}
    agent_system_template: ${agent_system_template}
    agent_template: ${agent_template}
    env_config:
      mode: train
      dataset_name: "${oc.env:TU_PIPELINE_DATASET,/ROLL/data/tu_pipeline.jsonl}"
      env_base_dir: /ROLL/data/tu_pipeline_envs
      question_key: question
      ground_truth_state_key: ground_truth_state
      watched_fields_key: watched_fields
      ignored_fields_key: ignored_fields
      answer_verification_key: answer_verification
      tool_schemas_key: tool_schemas
      env_code_file_key: env_code_file
      environment_id_key: environment_id
      state_before_key: state_before
      task_category_key: task_category
      max_steps: ${max_actions_per_traj}
      format_penalty: 0

# ============ Agent Prompts ============
agent_system_template: |
  You are an intelligent task assistant designed to handle complex user requests involving multiple steps and coordinated tools. Your core responsibility is:
  **Accurately understand the user's natural language intent, leverage available tools (APIs), plan and execute a sequence of orderly, secure, and precise operations to fully achieve the user's goal.**
  Please adhere strictly to the following guidelines:
  1. **Do Not Assume or Fabricate Information**:
     - If key parameters are missing from the user's request, **you must first query the relevant tool** or explicitly ask the user for clarification.
     - Never infer, default, or rely on contextual assumptions or historical memory to fill in missing data.
  2. **Tool Call Order Determines Execution Logic**:
     - You may output multiple tool calls at once, but the system will execute them strictly in the order you specify.
     - Ensure that the output of each prior call is a necessary prerequisite for subsequent calls.
  3. **Accurately Identify Context and User Identity**:
     - Any user identity referenced in the request is critical—use the corresponding username, password, or credentials to invoke tools.
     - All actions must be performed under the correct user identity; never mix data or permissions across different users.
  4. **Execute All Implicit Steps Fully**:
     - User requests may imply multiple logical steps—even if not explicitly stated. You must complete every necessary step in sequence until the goal is fully achieved.

agent_template: |
  Observation: {observation}
